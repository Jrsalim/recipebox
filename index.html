<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecipeBox 🍳 — Recipe Explorer</title>
  <meta name="description" content="RecipeBox — Discover thousands of recipes from around the world. Save favorites, build shopping lists, explore cuisines." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ================== HEADER ================== -->
  <header class="header">
    <div class="header-top">
      <h1 class="logo">
        <span class="logo-icon">🍳</span> RecipeBox
      </h1>

      <form class="search-bar" id="search-form" autocomplete="off">
        <input
          type="text"
          id="search-input"
          placeholder="Search for a recipe (e.g., chicken, pasta...)"
          aria-label="Search for a recipe"
        />
        <button type="submit" class="btn-search" aria-label="Run search">
          🔍
        </button>
      </form>

      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <span class="theme-icon">🌙</span>
      </button>
    </div>

    <nav class="nav" id="main-nav">
      <button class="nav-btn active" data-view="home">🏠 Home</button>
      <button class="nav-btn" data-view="categories">📂 Categories</button>
      <button class="nav-btn" data-view="areas">🌍 Cuisines</button>
      <button class="nav-btn" data-view="random">🎲 Surprise</button>
      <button class="nav-btn" data-view="favorites">❤️ Favorites <span class="badge" id="badge-favorites">0</span></button>
      <button class="nav-btn" data-view="shopping">🛒 Shopping <span class="badge" id="badge-shopping">0</span></button>
      <button class="nav-btn" data-view="history">🕐 History</button>
    </nav>
  </header>

  <!-- ================== MAIN CONTENT ================== -->
  <main id="main-content" class="main" aria-live="polite">
    <!-- Content is dynamically generated by app.js -->
  </main>

  <!-- ================== MODAL ================== -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close" id="modal-close" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- ================== TOAST ================== -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- ================== FOOTER ================== -->
  <footer class="footer">
    <p>
      Crafted with <span style="color: var(--color-primary);">♥</span> using vanilla JavaScript
      &middot; Powered by
      <a href="https://www.themealdb.com/" target="_blank" rel="noopener noreferrer">TheMealDB</a>
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
